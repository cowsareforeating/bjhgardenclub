<svg width="40" height="50" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.3" flood-color="#23391f" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#paper)">
    <path d="M40 5 C19 5 5 21 5 40 C5 67 40 95 40 95 C40 95 75 67 75 40 C75 21 61 5 40 5 Z" fill="#5f8a5e" fill-opacity="0.85"/>
    <path d="M40 5 C19 5 5 21 5 40 C5 67 40 95 40 95 C40 95 75 67 75 40 C75 21 61 5 40 5 Z" fill="#86ab74" fill-opacity="0.35" filter="url(#bloom)" transform="translate(-1.5,-2) scale(0.97)"/>
  </g>
  <!-- lucide: tree-deciduous (main) -->
  <g transform="translate(33,37) scale(1.25) translate(-12,-12)" fill="none" stroke="#eef3e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#halo)">
    <path d="M8 19a4 4 0 0 1-2.24-7.32A3.5 3.5 0 0 1 9 6.03V6a3 3 0 1 1 6 0v.04a3.5 3.5 0 0 1 3.24 5.65A4 4 0 0 1 16 19Z"/>
    <path d="M12 19v3"/>
  </g>
  <!-- lucide: flower (small) -->
  <g transform="translate(56,52) scale(0.78) translate(-12,-12)" fill="none" stroke="#eef3e6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#halo)">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5"/>
    <path d="M12 7.5V9"/>
    <path d="M7.5 12H9"/>
    <path d="M16.5 12H15"/>
    <path d="M12 16.5V15"/>
    <path d="m8 8 1.88 1.88"/>
    <path d="M14.12 9.88 16 8"/>
    <path d="m8 16 1.88-1.88"/>
    <path d="M14.12 14.12 16 16"/>
  </g>
  <g transform="translate(62,18)" filter="url(#paper)">
    <circle r="14" fill="#ffffff" fill-opacity="0.9"/>
    <circle r="11" fill="#c0584f" fill-opacity="0.85"/>
    <circle r="9" fill="#d97a6e" fill-opacity="0.4" filter="url(#bloom)"/>
